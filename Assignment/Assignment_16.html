<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Select, Textarea and Buttons</title></head>
<body>
  <form>
    <p><label for="course">Course:</label>
      <select id="course" name="course">
        <option value="ECE">ECE</option>
        <option value="CSE">CSE</option>
        <option value="BCA">BCA</option>
      </select>
    </p>
    <p><label for="feedback">Feedback:</label><br>
      <textarea id="feedback" name="feedback" rows="5" cols="35" placeholder="Write here..."></textarea>
    </p>
    <button type="submit">Submit</button>
    <button type="reset">Reset</button>
    <button type="button" onclick="alert('Hello!')">Click Me</button>
  </form>
</body>
</html>
