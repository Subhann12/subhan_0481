<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Links and Images</title></head>
<body id="top">
  <h2>Links demo</h2>
  <p><a href="https://www.wikipedia.org/" target="_blank" rel="noopener">External link</a></p>
  <p><a href="#bottom">Jump to bottom</a></p>
  <p><a href="mailto:college@example.com">Email us</a></p>
  <p>Logo<br>
    <a href="https://www.example.com/" target="_blank" rel="noopener">
      <img src="https://placehold.co/100x70?text=Logo" alt="College logo" width="100" height="70">
    </a>
  </p>
  <div style="margin-top:350px" id="bottom">Bottom. <a href="#top">Back to top</a></div>
</body>
</html>
